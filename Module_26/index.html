<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Tailwind CSS</title>
    <!-- Tailwind cnn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- custom css(for learning responsiveness) -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- arbitary value -->
    <h1 class="text-[#0080ff77] text-4xl">Hello,Tailwind!!</h1>
    <!-- tailwind fixed value -->
    <h1 class="text-black-800 bg-[url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809')] bg-center bg-cover h-375">Fuck OFF!!</h1>

    <!-- Our first responsive learning -->

    <h1 class="test">Our first responsive element</h1>

    <!-- responsive with tailwind -->
    <h3 class="text-[25px] xl:text-5xl sm:text-3xl md:text-4xl font-bold border-4 border-amber-700 bg-blue-200 rounded-3xl mt-2 mb-4" >Programming Hero</h3>

    <!-- card : height,width,padding,margin,border -->
    <!-- flex learning  -->
    <h2 class="text-3xl font-bold text-blue-800">Layout using flex</h2>                            
    <div class="flex flex-col m-8 gap-4 md:flex-row ">
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl">Card-1</div>
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl">Card-2</div>
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl">Card-3</div>
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl">Card-4</div>
    </div>

    <!-- Grid learning -->
    <h2 class="text-3xl font-bold text-blue-800">Layout using grid</h2>                            
    <div class="grid m-5 gap-2 grid-cols-1 md:grid-cols-12">
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl col-span-1 md:col-span-2">Card-1</div>
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl col-span-1 md:col-span-4">Card-2</div>
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl col-span-1 md:col-span-4">Card-3</div>
    <div class="h-64 w-full bg-cyan-900 p-2 border-4 rounded-2xl flex justify-center items-center font-bold text-2xl col-span-1 md:col-span-2">Card-4</div>
    </div>


</body>
</html>
