<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>build a calender</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            grid-template-rows: repeat(5,1fr);
            gap: 10px;

        }
       
        .day, .week-days{
            background-color: rgb(199, 150, 150);
            border:2px solid rgb(255, 255, 255);
            height: 50px;
            width: 80px;
            border-radius: 10px;
            display: flex;
            font-size: 1.2rem;
            align-items: center;
            justify-content: center;
            
        }
         .week-days{
            background-color: rgb(133, 187, 188);
            height: 30px;  
        }

    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="week-days">S</div>
            <div class="week-days">M</div>
            <div class="week-days">T</div>
            <div class="week-days">W</div>
            <div class="week-days">T</div>
            <div class="week-days">F</div>
            <div class="week-days">S</div>

            <div class="day">28</div>
            <div class="day">29</div>
            <div class="day">30</div>
            <div class="day">1</div>
            <div class="day">2</div>
            <div class="day">3</div>
            <div class="day">4</div>
            <div class="day">5</div>
            <div class="day">6</div>
            <div class="day">7</div>
            <div class="day">8</div>
            <div class="day">9</div>
            <div class="day">10</div>
            <div class="day">11</div>
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
            <div class="day">15</div>
            <div class="day">16</div>
            <div class="day">17</div>
            <div class="day">18</div>
            <div class="day">19</div>
            <div class="day">20</div>
            <div class="day">21</div>
            <div class="day">22</div>
            <div class="day">23</div>
            <div class="day">24</div>
            <div class="day">25</div>
            <div class="day">26</div>
            <div class="day">27</div>
            <div class="day">28</div>
            <div class="day">29</div>
            <div class="day">30</div>
            <div class="day">31</div>
            <div class="day">01</div>
        </div>
       
    </main>
    
</body>
</html>
